name = "yucp-delivery-worker"
main = "src/index.ts"
compatibility_date = "2026-04-22"
workers_dev = false
send_metrics = false

[observability]
enabled = true

# Runtime variable names, supplied by the Worker secret sync or local e2e harness:
# CAS_S3_ENDPOINT
# CAS_S3_REGION
# CAS_S3_BUCKET
# CAS_INDEX_PREFIX
# CAS_CHUNK_PREFIX
# STORAGE_FORMAT_VERSION
#
# Secret names, supplied by the Worker secret sync or local e2e harness:
# CAS_S3_READONLY_ACCESS_KEY_ID
# CAS_S3_READONLY_SECRET_ACCESS_KEY
# DELIVERY_HMAC_KEY
