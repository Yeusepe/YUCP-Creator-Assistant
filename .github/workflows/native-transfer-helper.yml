name: Native Transfer Helper

on:
  push:
    branches: [main, develop]
    paths:
      - ".github/workflows/native-transfer-helper.yml"
      - "Verify/Native/transfer-helper/**"
  pull_request:
    branches: [main, develop]
    paths:
      - ".github/workflows/native-transfer-helper.yml"
      - "Verify/Native/transfer-helper/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-transfer-helper-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            runner: ubuntu-latest
          - platform: Windows
            runner: windows-latest
    defaults:
      run:
        working-directory: Verify/Native/transfer-helper
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      # Official setup contract: https://github.com/actions/setup-go
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: 'Verify/Native/transfer-helper/go.mod'
          cache-dependency-path: 'Verify/Native/transfer-helper/go.sum'

      - name: Test Windows native module
        if: runner.os == 'Windows'
        env:
          GOFLAGS: -mod=readonly
        run: go test ./...

      - name: Test portable Linux packages
        if: runner.os == 'Linux'
        env:
          GOFLAGS: -mod=readonly
        shell: bash
        run: |
          set -euo pipefail
          go test ./cmd/yucp-local-tuf-repository ./cmd/yucp-tuf-online-repository ./cmd/yucp-tuf-root
          go test ./internal/delivery ./internal/dpop ./internal/packagecontract ./internal/reconstructor
          go test ./internal/trust ./internal/tufclient ./internal/tufrepository ./internal/tufroot

      - name: Build Linux commands
        if: runner.os == 'Linux'
        env:
          GOFLAGS: -mod=readonly
        shell: bash
        run: |
          set -euo pipefail
          go build ./cmd/yucp-transfer-helper
          go build ./cmd/yucp-tuf-root
          go build ./cmd/yucp-tuf-online-repository
          go build ./cmd/yucp-local-tuf-repository

      - name: Build Windows commands
        if: runner.os == 'Windows'
        env:
          GOFLAGS: -mod=readonly
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go test -tags=integrationharness ./cmd/yucp-package-broker-test-harness
          go build ./cmd/yucp-transfer-helper
          go build ./cmd/yucp-package-broker
          go build -tags=integrationharness ./cmd/yucp-package-broker-test-harness
          go build ./cmd/yucp-tuf-root
          go build ./cmd/yucp-tuf-online-repository
          go build ./cmd/yucp-local-tuf-repository
