name: Storage E2E

on:
  push:
    branches: [main, develop]
    paths:
      - ".github/workflows/storage-e2e.yml"
      - "ops/storage-core/**"
      - "ops/catalog/**"
      - "ops/importer/**"
      - "ops/ingest-pipeline/**"
      - "ops/ingest-tus/**"
      - "ops/gc/**"
      - "ops/scheduler/**"
      - "ops/testing/**"
      - "services/delivery-worker/**"
      - "package.json"
      - "bun.lock"
  pull_request:
    branches: [main, develop]
    paths:
      - ".github/workflows/storage-e2e.yml"
      - "ops/storage-core/**"
      - "ops/catalog/**"
      - "ops/importer/**"
      - "ops/ingest-pipeline/**"
      - "ops/ingest-tus/**"
      - "ops/gc/**"
      - "ops/scheduler/**"
      - "ops/testing/**"
      - "services/delivery-worker/**"
      - "package.json"
      - "bun.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: storage-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  storage-e2e:
    name: Storage and Delivery E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5
        with:
          bun-version: "1.3.9"

      - name: Install dependencies
        env:
          HEROUI_AUTH_TOKEN: ${{ secrets.HEROUI_AUTH_TOKEN }}
        run: bun install --frozen-lockfile

      - name: Install desync v1.0.3
        env:
          DESYNC_VERSION: "1.0.3"
          DESYNC_SHA256: "ad4dd9e91b57eef8627d2038df09281d7f38dca02eeca0e66592b54087619953"
        run: |
          set -euo pipefail
          archive="desync_${DESYNC_VERSION}_linux_amd64.tar.gz"
          archive_path="${RUNNER_TEMP}/${archive}"
          install_dir="${RUNNER_TEMP}/desync-${DESYNC_VERSION}"
          curl --fail --location --silent --show-error \
            --output "${archive_path}" \
            "https://github.com/folbricht/desync/releases/download/v${DESYNC_VERSION}/${archive}"
          echo "${DESYNC_SHA256}  ${archive_path}" | sha256sum --check --strict
          mkdir --parents "${install_dir}"
          tar --extract --gzip --file "${archive_path}" --directory "${install_dir}" desync
          chmod 0755 "${install_dir}/desync"
          echo "${install_dir}" >> "${GITHUB_PATH}"
          "${install_dir}/desync" --help > /dev/null

      - name: Verify Docker and prepare test images
        run: |
          docker version
          docker pull postgres@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193 # postgres:17-alpine
          docker pull minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e # minio/minio:RELEASE.2025-09-07T16-13-09Z

      - name: Run storage and delivery E2E suites
        run: bun run test:storage:e2e
