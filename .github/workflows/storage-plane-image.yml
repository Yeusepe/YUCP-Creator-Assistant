name: Storage Plane Image

on:
  push:
    branches: [main]
    paths:
      - "ops/**"
      - "packages/**"
      - "bun.lock"
      - "package.json"
      - "tsconfig*.json"
      - ".github/workflows/storage-plane-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and push storage-plane image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build image
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          set -euo pipefail
          docker build \
            --file ops/deploy/storage-plane.Dockerfile \
            --tag "ghcr.io/yeusepe/yucp-storage-plane:${GITHUB_SHA}" \
            --tag "ghcr.io/yeusepe/yucp-storage-plane:latest" \
            .
          # Guard: the public image must never contain the licensed HeroUI Pro packages.
          if docker run --rm --entrypoint sh "ghcr.io/yeusepe/yucp-storage-plane:${GITHUB_SHA}" \
            -c 'test -e /src/node_modules/@heroui-pro'; then
            echo "HeroUI Pro packages found in image; refusing to push." >&2
            exit 1
          fi

      - name: Push image
        run: |
          docker push "ghcr.io/yeusepe/yucp-storage-plane:${GITHUB_SHA}"
          docker push "ghcr.io/yeusepe/yucp-storage-plane:latest"
