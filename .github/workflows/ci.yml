name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5
        with:
          bun-version: "1.3.9"

      - name: Install dependencies
        env:
          HEROUI_AUTH_TOKEN: ${{ secrets.HEROUI_AUTH_TOKEN }}
        run: bun install --frozen-lockfile

      - name: Security audit
        # h3 CVEs are ignored because @tanstack/start-server-core aliases h3 as
        # h3-v2 (npm:h3@2.0.1-rc.16), which bun overrides cannot resolve.
        # Remove these ignores once @tanstack/start-server-core ships with h3 >=2.0.1-rc.17.
        # GHSA-p2fr-6hmx-4528 has no stable patch available; revisit when better-auth 1.7.0 ships stable.
        run: bun audit --ignore GHSA-4hxc-9384-m385 --ignore GHSA-2j6q-whv2-gh6w --ignore GHSA-p2fr-6hmx-4528

      - name: Run linter
        run: bun run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5
        with:
          bun-version: "1.3.9"

      - name: Install dependencies
        env:
          HEROUI_AUTH_TOKEN: ${{ secrets.HEROUI_AUTH_TOKEN }}
        run: bun install --frozen-lockfile

      - name: Run type check
        run: bun run typecheck

  web-build:
    name: Web Build
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5
        with:
          bun-version: "1.3.9"

      - name: Install dependencies
        env:
          HEROUI_AUTH_TOKEN: ${{ secrets.HEROUI_AUTH_TOKEN }}
        run: bun install --frozen-lockfile

      - name: Build web app
        env:
          ASSETS_S3_BUCKET: ${{ secrets.ASSETS_S3_BUCKET }}
          ASSETS_S3_ENDPOINT: ${{ secrets.ASSETS_S3_ENDPOINT }}
          ASSETS_S3_REGION: ${{ secrets.ASSETS_S3_REGION }}
          ASSETS_S3_READONLY_ACCESS_KEY_ID: ${{ secrets.ASSETS_S3_READONLY_ACCESS_KEY_ID }}
          ASSETS_S3_READONLY_SECRET_ACCESS_KEY: ${{ secrets.ASSETS_S3_READONLY_SECRET_ACCESS_KEY }}
        run: bun run --filter '@yucp/web' build

  external-integrations:
    name: External Integration Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5
        with:
          bun-version: "1.3.9"

      - name: Install dependencies
        env:
          HEROUI_AUTH_TOKEN: ${{ secrets.HEROUI_AUTH_TOKEN }}
        run: bun install --frozen-lockfile

      - name: Run external integration contract gate
        run: bun run test:external-integrations

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5
        with:
          bun-version: "1.3.9"

      - name: Install dependencies
        env:
          HEROUI_AUTH_TOKEN: ${{ secrets.HEROUI_AUTH_TOKEN }}
        run: bun install --frozen-lockfile

      - name: Run full test gate (fast, boundary mock ratchet, Convex, API integration)
        run: bun run test:ci

  web-tests:
    name: Web Tests
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5
        with:
          bun-version: "1.3.9"

      - name: Install dependencies
        env:
          HEROUI_AUTH_TOKEN: ${{ secrets.HEROUI_AUTH_TOKEN }}
        run: bun install --frozen-lockfile

      - name: Run web test gate
        env:
          ASSETS_S3_BUCKET: ${{ secrets.ASSETS_S3_BUCKET }}
          ASSETS_S3_ENDPOINT: ${{ secrets.ASSETS_S3_ENDPOINT }}
          ASSETS_S3_REGION: ${{ secrets.ASSETS_S3_REGION }}
          ASSETS_S3_READONLY_ACCESS_KEY_ID: ${{ secrets.ASSETS_S3_READONLY_ACCESS_KEY_ID }}
          ASSETS_S3_READONLY_SECRET_ACCESS_KEY: ${{ secrets.ASSETS_S3_READONLY_SECRET_ACCESS_KEY }}
        run: bun run --filter '@yucp/web' test:ci

  convex-real:
    name: Convex Real Backend
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5
        with:
          bun-version: "1.3.9"

      - name: Install dependencies
        env:
          HEROUI_AUTH_TOKEN: ${{ secrets.HEROUI_AUTH_TOKEN }}
        run: bun install --frozen-lockfile

      - name: Install desync v1.0.3
        env:
          DESYNC_VERSION: "1.0.3"
          DESYNC_SHA256: "ad4dd9e91b57eef8627d2038df09281d7f38dca02eeca0e66592b54087619953"
        run: |
          set -euo pipefail
          archive="desync_${DESYNC_VERSION}_linux_amd64.tar.gz"
          archive_path="${RUNNER_TEMP}/${archive}"
          install_dir="${RUNNER_TEMP}/desync-${DESYNC_VERSION}"
          curl --fail --location --silent --show-error \
            --output "${archive_path}" \
            "https://github.com/folbricht/desync/releases/download/v${DESYNC_VERSION}/${archive}"
          echo "${DESYNC_SHA256}  ${archive_path}" | sha256sum --check --strict
          mkdir --parents "${install_dir}"
          tar --extract --gzip --file "${archive_path}" --directory "${install_dir}" desync
          chmod 0755 "${install_dir}/desync"
          echo "${install_dir}" >> "${GITHUB_PATH}"
          "${install_dir}/desync" --help > /dev/null

      - name: Prepare buyer delivery storage images
        run: |
          docker version
          docker pull postgres@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193 # postgres:17-alpine
          docker pull minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e # minio/minio:RELEASE.2025-09-07T16-13-09Z

      - name: Boot and provision self-hosted Convex
        run: bun run test:convex:real:up

      - name: Run real Convex deploy gate
        run: bun run test:convex:deploy

      - name: Run self-hosted Convex real suite
        run: bun run test:convex:real

      - name: Run full buyer delivery flow
        run: bun run test:flow:e2e:run

      - name: Dump Convex logs
        if: failure()
        run: bun run ops/convex-real/manage.ts logs

      - name: Tear down self-hosted Convex
        if: always()
        run: bun run test:convex:real:down

  e2e-flows:
    name: E2E User Flows
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: e2e-flows-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        env:
          HEROUI_AUTH_TOKEN: ${{ secrets.HEROUI_AUTH_TOKEN }}
        run: bun install --frozen-lockfile

      - name: Boot and provision self-hosted Convex
        run: bun run test:convex:real:up

      - name: Run real Convex deploy gate
        run: bun run test:convex:deploy

      - name: Enable self-hosted real test helpers
        run: bun run ops/convex-real/manage.ts test-signals

      - name: Run real API user journey flows
        env:
          E2E_GUMROAD_PRODUCT_ID: ${{ secrets.E2E_GUMROAD_PRODUCT_ID }}
          E2E_GUMROAD_LICENSE_KEY: ${{ secrets.E2E_GUMROAD_LICENSE_KEY }}
          E2E_JINXXY_API_KEY: ${{ secrets.E2E_JINXXY_API_KEY }}
          E2E_JINXXY_LICENSE_KEY: ${{ secrets.E2E_JINXXY_LICENSE_KEY }}
          E2E_JINXXY_PRODUCT_REF: ${{ secrets.E2E_JINXXY_PRODUCT_REF }}
          JINXXY_DISPOSABLE_LICENSE_KEY: ${{ secrets.JINXXY_DISPOSABLE_LICENSE_KEY }}
        run: bun run test:e2e:flows:run

      - name: Tear down self-hosted Convex
        if: always()
        run: bun run test:convex:real:down
