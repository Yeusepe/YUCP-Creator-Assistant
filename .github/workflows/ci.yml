name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5
        with:
          bun-version: "1.3.9"

      - name: Install dependencies
        env:
          HEROUI_AUTH_TOKEN: ${{ secrets.HEROUI_AUTH_TOKEN }}
        run: bun install --frozen-lockfile

      - name: Security audit
        # h3 CVEs are ignored because @tanstack/start-server-core aliases h3 as
        # h3-v2 (npm:h3@2.0.1-rc.16), which bun overrides cannot resolve.
        # Remove these ignores once @tanstack/start-server-core ships with h3 >=2.0.1-rc.17.
        # GHSA-p2fr-6hmx-4528 has no stable patch available; revisit when better-auth 1.7.0 ships stable.
        run: bun audit --ignore GHSA-4hxc-9384-m385 --ignore GHSA-2j6q-whv2-gh6w --ignore GHSA-p2fr-6hmx-4528

      - name: Run linter
        run: bun run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5
        with:
          bun-version: "1.3.9"

      - name: Install dependencies
        env:
          HEROUI_AUTH_TOKEN: ${{ secrets.HEROUI_AUTH_TOKEN }}
        run: bun install --frozen-lockfile

      - name: Run type check
        run: bun run typecheck

  external-integrations:
    name: External Integration Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5
        with:
          bun-version: "1.3.9"

      - name: Install dependencies
        env:
          HEROUI_AUTH_TOKEN: ${{ secrets.HEROUI_AUTH_TOKEN }}
        run: bun install --frozen-lockfile

      - name: Run external integration contract gate
        run: bun run test:external-integrations

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5
        with:
          bun-version: "1.3.9"

      - name: Install dependencies
        env:
          HEROUI_AUTH_TOKEN: ${{ secrets.HEROUI_AUTH_TOKEN }}
        run: bun install --frozen-lockfile

      - name: Run full test gate (fast, boundary mock ratchet, Convex, API integration)
        run: bun run test:ci

  backstage-ingest-integration:
    name: Backstage Ingest Integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      redis:
        image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5
        with:
          bun-version: "1.3.9"

      - name: Install dependencies
        env:
          HEROUI_AUTH_TOKEN: ${{ secrets.HEROUI_AUTH_TOKEN }}
        run: bun install --frozen-lockfile

      # The live ops/backstage-lore-download-e2e.ts smoke requires deployed services and stays manual.
      - name: Run Backstage ingest integration
        env:
          BACKSTAGE_INGEST_REDIS_URL: redis://localhost:6379
        run: bun run test:ingest:integration

  lore-storage-contract:
    name: Lore Storage Contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      loreserver:
        image: ghcr.io/yeusepe/lore-server@sha256:014ed979e4426a54abf8b814d84f765dec59de601017e282ebc64dc9eb16e1c6
        ports: ['41339:41339']
        env:
          LORE__SERVER__HTTP__PRESIGNED_URL_HMAC_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5
        with:
          bun-version: "1.3.9"

      - name: Install dependencies
        env:
          HEROUI_AUTH_TOKEN: ${{ secrets.HEROUI_AUTH_TOKEN }}
        run: bun install --frozen-lockfile

      - name: Wait for loreserver
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 2 http://localhost:41339/ || true)
            if [ -n "$code" ] && [ "$code" != "000" ]; then
              echo "loreserver ready (http=$code) after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "loreserver did not become ready on :41339"; exit 1

      - name: Run Lore storage contract
        env:
          LORE_API_BASE_URL: http://localhost:41339
          LORE_PRESIGN_HMAC_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          LORE_REPO_NAMESPACE_SALT: lore-contract-ci
          LORE_ACCESS_CLIENT_ID: unused
          LORE_ACCESS_CLIENT_SECRET: unused
        run: bun run test:lore:contract

  convex-real:
    name: Convex Real Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5
        with:
          bun-version: "1.3.9"

      - name: Install dependencies
        env:
          HEROUI_AUTH_TOKEN: ${{ secrets.HEROUI_AUTH_TOKEN }}
        run: bun install --frozen-lockfile

      - name: Boot and provision self-hosted Convex
        run: bun run test:convex:real:up

      - name: Run real Convex deploy gate
        run: bun run test:convex:deploy

      - name: Run self-hosted Convex real suite
        run: bun run test:convex:real

      - name: Dump Convex logs
        if: failure()
        run: bun run ops/convex-real/manage.ts logs

      - name: Tear down self-hosted Convex
        if: always()
        run: bun run test:convex:real:down

  e2e-flows:
    name: E2E User Flows
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: e2e-flows-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        env:
          HEROUI_AUTH_TOKEN: ${{ secrets.HEROUI_AUTH_TOKEN }}
        run: bun install --frozen-lockfile

      - name: Boot and provision self-hosted Convex
        run: bun run test:convex:real:up

      - name: Run real Convex deploy gate
        run: bun run test:convex:deploy

      - name: Enable self-hosted real test helpers
        run: bun run ops/convex-real/manage.ts test-signals

      - name: Run real API user journey flows
        env:
          E2E_GUMROAD_PRODUCT_ID: ${{ secrets.E2E_GUMROAD_PRODUCT_ID }}
          E2E_GUMROAD_LICENSE_KEY: ${{ secrets.E2E_GUMROAD_LICENSE_KEY }}
          E2E_JINXXY_API_KEY: ${{ secrets.E2E_JINXXY_API_KEY }}
          E2E_JINXXY_LICENSE_KEY: ${{ secrets.E2E_JINXXY_LICENSE_KEY }}
          E2E_JINXXY_PRODUCT_REF: ${{ secrets.E2E_JINXXY_PRODUCT_REF }}
          JINXXY_DISPOSABLE_LICENSE_KEY: ${{ secrets.JINXXY_DISPOSABLE_LICENSE_KEY }}
        run: bun run test:e2e:flows:run

      - name: Tear down self-hosted Convex
        if: always()
        run: bun run test:convex:real:down
