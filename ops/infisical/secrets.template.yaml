# Infisical Secrets Template
# =========================
# This file documents all required secrets with placeholder values.
# DO NOT store actual secrets here - copy to Infisical directly.
#
# Environment: dev | preview | prod
# Project: gumroad-{env}

# =============================================================================
# Discord Bot Secrets (/bot/discord/)
# =============================================================================

bot:
  discord:
    # Bot token from Discord Developer Portal → Bot → Token
    # Rotation: On compromise / 90 days
    DISCORD_BOT_TOKEN: "placeholder_bot_token_from_discord"

    # OAuth Client ID (public, can be committed)
    # Rotation: Never
    DISCORD_CLIENT_ID: "123456789012345678"

    # OAuth Client Secret from Discord Developer Portal → OAuth2
    # Rotation: On compromise / 90 days
    DISCORD_CLIENT_SECRET: "placeholder_oauth_secret_from_discord"

    # Public key for interaction endpoint verification
    # Rotation: On compromise
    DISCORD_PUBLIC_KEY: "placeholder_public_key_hex"

    # Enable Convex Workpool execution for role sync/removal jobs.
    # Must be synced to Convex and set consistently with bot runtime config.
    ROLE_SYNC_VIA_WORKPOOL: "false"

# =============================================================================
# API Authentication Secrets (/api/auth/)
# =============================================================================

api:
  auth:
    # Session signing key for Better Auth (JWT / session cookies only)
    # Generate: openssl rand -base64 32
    # Rotation: On compromise / 180 days (invalidates all sessions)
    BETTER_AUTH_SECRET: "placeholder_32_byte_base64_secret"

    # Dedicated key for encrypting stored provider credentials (envelope encryption KEK)
    # MUST be different from BETTER_AUTH_SECRET
    # MIGRATION: When first set, re-encrypt all stored provider credentials.
    # Generate: openssl rand -base64 32
    # Rotation: On compromise / 365 days (requires credential re-encryption)
    ENCRYPTION_SECRET: "placeholder_32_byte_base64_secret"

    # Optional dedicated key for verification support-code encryption
    # If omitted, BETTER_AUTH_SECRET is used as the fallback.
    # Generate: openssl rand -base64 32
    ERROR_REFERENCE_SECRET: "placeholder_32_byte_base64_secret"

    discord:
      # Same as bot.discord but for API OAuth
      DISCORD_CLIENT_ID: "123456789012345678"
      DISCORD_CLIENT_SECRET: "placeholder_oauth_secret_from_discord"

# =============================================================================
# Database Secrets (/api/database/)
# =============================================================================

  database:
    # PostgreSQL connection string for Better Auth
    # Format: postgresql://user:password@host:port/database
    # Rotation: On credential change
    DATABASE_URL: "postgresql://user:placeholder_password@localhost:5432/gumroad_auth"

# =============================================================================
# Integration Secrets (/api/integrations/)
# =============================================================================

  integrations:
    gumroad:
      # OAuth Client ID (public)
      # Rotation: Never
      GUMROAD_CLIENT_ID: "placeholder_gumroad_client_id"

      # OAuth Client Secret from Gumroad Settings → Advanced
      # Rotation: On compromise / 90 days
      GUMROAD_CLIENT_SECRET: "placeholder_gumroad_client_secret"

    jinxxy:
      # API key from Jinxxy dashboard
      # Rotation: On compromise / 90 days
      JINXXY_API_KEY: "placeholder_jinxxy_api_key"

  email:
    # Resend API key from resend.com
    # Rotation: On compromise / 90 days
    RESEND_API_KEY: "re_placeholder_from_resend_dashboard"

    # From address for transactional emails (e.g. Creator Assistant <noreply@yourdomain.com>)
    # Must use a verified domain in Resend
    EMAIL_FROM: "Creator Assistant <noreply@yourdomain.com>"

# =============================================================================
# Infrastructure Secrets (/infra/)
# =============================================================================


infra:
  urls:
    BETTER_AUTH_URL: ""
    FRONTEND_URL: ""
    API_BASE_URL: ""    
    API_INTERNAL_URL: ""

  convex:
    # Convex deployment URL (semi-public)
    # Rotation: Never
    CONVEX_URL: "https://placeholder-deployment.convex.cloud"

    # Shared API credential used by apps/api, Convex, and the catalog scheduler publisher.
    # Rotation: On compromise / 90 days
    CONVEX_API_SECRET: "placeholder_convex_api_secret"

    # Full deploy key from Convex Dashboard → Settings → URL and deploy key
    # Format: dev:xxx|eyJ... or prod:xxx|eyJ... (copy the entire string)
    # Required for sync:convex:env (Infisical → Convex env sync on dev:infisical)
    # Rotation: On compromise / 90 days
    CONVEX_DEPLOY_KEY: "dev:team:project|eyJ_placeholder_full_deploy_key"

    # API base URL for backfill (Convex dev calls this to fetch past purchases)
    # Dev: Tailscale Funnel URL (e.g. https://machine-name.tailnet-name.ts.net) - run `tailscale funnel 3001` first
    # Prod: Production API URL (e.g. https://api.yourdomain.com)
    BACKFILL_API_URL: "https://your-machine.tailnet-name.ts.net"

    # Prod-only: use CONVEX_URL_PROD, CONVEX_DEPLOY_KEY_PROD, BACKFILL_API_URL_PROD for sync:convex:env:prod
    CONVEX_URL_PROD: "https://prod-deployment.convex.cloud"
    CONVEX_DEPLOY_KEY_PROD: "prod:team:project|eyJ_placeholder_prod_deploy_key"
    BACKFILL_API_URL_PROD: "https://api.yourdomain.com"

  observability:
    # Public ingest key for HyperDX browser/session-replay SDKs.
    # Treat as low-sensitivity config, but still store centrally for consistency.
    HYPERDX_API_KEY: "placeholder_hyperdx_public_ingest_key"

    # Server-side HyperDX service key used for every web source-map upload,
    # including preview versions. Never expose this key to the browser or
    # Cloudflare Worker bindings.
    HYPERDX_SERVICE_KEY: "placeholder_hyperdx_service_key"

    # Local or hosted HyperDX UI URL. Local default is http://localhost:8080.
    HYPERDX_APP_URL: "http://localhost:8080"

    # OTLP collector endpoints for local or hosted HyperDX.
    HYPERDX_OTLP_HTTP_URL: "http://localhost:4318"
    HYPERDX_OTLP_GRPC_URL: "localhost:4317"

    # Default OTLP exporter endpoint for local SDK wiring.
    OTEL_EXPORTER_OTLP_ENDPOINT: "http://localhost:4318"

    # Optional explicit OTLP auth headers override for API/bot.
    # Usually left unset because the apps derive Authorization=<HYPERDX_API_KEY> automatically.
    OTEL_EXPORTER_OTLP_HEADERS: ""

    # Secret configured on the Convex custom log-stream webhook.
    CONVEX_LOG_STREAM_SECRET: "placeholder_convex_log_stream_secret"

  signing:
    service-auth:
      # Shared actor-binding secret used by apps/api, Convex, bot, and the catalog scheduler.
      # Rotation: On compromise / 90 days
      INTERNAL_SERVICE_AUTH_SECRET: "placeholder_internal_service_auth_secret"

    # Shared bearer secret for service-to-service API proxying and Tempo RPC.
    # Required in preview/prod. Local development can omit it because web, api,
    # and bot share a built-in development-only fallback.
    # Generate: openssl rand -base64 32
    # Rotation: On compromise / 90 days
    INTERNAL_RPC_SHARED_SECRET: "placeholder_internal_rpc_shared_secret"

    # Webhook signing secret for signature verification
    # Generate: openssl rand -hex 32
    # Rotation: On compromise / 90 days
    WEBHOOK_SIGNING_SECRET: "placeholder_webhook_signing_secret_hex"

  coupling:
    # Private coupling forensics scan service base URL.
    # This must point at the separately deployed private coupling service, not the public API.
    # Example: https://coupling.internal.yourdomain.com
    # Rotation: On topology or host change
    YUCP_COUPLING_SERVICE_BASE_URL: "https://coupling.internal.yourdomain.com"

    # Shared bearer secret between the public API and the private coupling scan service.
    # Generate: openssl rand -base64 32
    # Rotation: On compromise / 90 days
    YUCP_COUPLING_SERVICE_SHARED_SECRET: "placeholder_coupling_service_shared_secret"

# =============================================================================
# Phase 4 Storage and Delivery (/storage/)
# =============================================================================

storage:
  ingest:
    shared:
      # SHARED: This single UPLOAD_HMAC_KEY entry MUST be used unchanged by apps/api and ingest-tus.
      # Creator-upload capability signing key.
      # Generate: openssl rand -base64 32
      # Rotation: Coordinated apps/api and ingest-tus redeploy / 90 days
      UPLOAD_HMAC_KEY: "placeholder_upload_hmac_key"

      # Public ingest-tus origin returned by apps/api to browser upload clients.
      # Rotation: On ingest service topology or domain change
      INGEST_TUS_URL: "https://ingest.placeholder.invalid"

    runtime:
      # Local spool directory and per-upload limit for the ingest-tus runtime.
      # Rotation: On deployment storage policy change
      INGEST_UPLOAD_DIR: "placeholder_ingest_upload_directory"
      INGEST_SCRATCH_DIR: "placeholder_ingest_scratch_directory"
      INGEST_MAX_BYTES: "placeholder_ingest_max_bytes"

      # Optional browser origin allowed to call the separate ingest-tus service.
      # Rotation: On application origin change
      INGEST_ALLOWED_ORIGIN: "https://app.placeholder.invalid"

  catalog:
    # PostgreSQL connection string shared by ingest-tus and the catalog scheduler.
    # Rotation: On database credential change
    CATALOG_DATABASE_URL: "postgresql://placeholder_user:placeholder_password@placeholder.invalid:5432/catalog"
    # Scheduler and GC must agree on when a failed version is terminal.
    CATALOG_MAX_ATTEMPTS: "5"
    # Terminal failures remain auditable and retryable for seven days before GC tombstones them.
    CATALOG_FAILED_RETENTION_MS: "604800000"

  monitoring:
    scheduler:
      # Kener v4 push endpoint. The path contains a credential and must never be logged.
      # Contract: https://kener.ing/docs/v4/monitors/heartbeat
      # Rotation: Coordinate Kener and scheduler configuration.
      SCHEDULER_STATUS_HEARTBEAT_URL: "https://status.placeholder.invalid/ext/heartbeat/yucp-ingest-scheduler/placeholder_secret"

    garbage-collection:
      # Kener v4 push endpoint. Emit only after a successful collection cycle.
      # Contract: https://kener.ing/docs/v4/monitors/heartbeat
      # Rotation: Coordinate Kener and storage-GC configuration.
      STORAGE_GC_STATUS_HEARTBEAT_URL: "https://status.placeholder.invalid/ext/heartbeat/yucp-storage-gc/placeholder_secret"

  common:
    configuration:
      # Common chunks use one dedicated immutable storage role.
      # Rotation: On bucket, region, endpoint, or storage layout change
      COMMON_S3_ENDPOINT: "https://s3.placeholder.invalid"
      COMMON_S3_REGION: "placeholder_region"
      COMMON_S3_BUCKET: "placeholder_common_bucket"
      COMMON_CHUNK_PREFIX: "chunks/"
      COMMON_S3_REQUEST_TIMEOUT_MS: "30000"
      STORAGE_FORMAT_VERSION: "desync-uncompressed-sha256-v1"

    write:
      # Only ingest-tus and the scheduler receive write credentials.
      # Rotation: On compromise or each 90 days
      COMMON_S3_ACCESS_KEY_ID: "placeholder_common_write_access_key_id"
      COMMON_S3_SECRET_ACCESS_KEY: "placeholder_common_write_secret_access_key"

    read:
      # Only common-content delivery runtimes receive read credentials.
      # Rotation: On compromise or each 90 days
      COMMON_S3_READONLY_ACCESS_KEY_ID: "placeholder_common_read_access_key_id"
      COMMON_S3_READONLY_SECRET_ACCESS_KEY: "placeholder_common_read_secret_access_key"

  metadata:
    configuration:
      # Signed metadata uses one dedicated immutable storage role.
      # Rotation: On bucket, region, endpoint, or storage layout change
      METADATA_S3_ENDPOINT: "https://s3.placeholder.invalid"
      METADATA_S3_REGION: "placeholder_region"
      METADATA_S3_BUCKET: "placeholder_metadata_bucket"
      METADATA_INDEX_PREFIX: "indexes/"
      METADATA_S3_REQUEST_TIMEOUT_MS: "30000"

    write:
      # Only publication runtimes receive metadata write credentials.
      # Rotation: On compromise or each 90 days
      METADATA_S3_ACCESS_KEY_ID: "placeholder_metadata_write_access_key_id"
      METADATA_S3_SECRET_ACCESS_KEY: "placeholder_metadata_write_secret_access_key"

    read:
      # Only metadata delivery runtimes receive read credentials.
      # Rotation: On compromise or each 90 days
      METADATA_S3_READONLY_ACCESS_KEY_ID: "placeholder_metadata_read_access_key_id"
      METADATA_S3_READONLY_SECRET_ACCESS_KEY: "placeholder_metadata_read_secret_access_key"

  protected:
    configuration:
      # Protected source chunks use one creator-scoped storage role.
      # Rotation: On bucket, region, endpoint, or storage layout change
      PROTECTED_S3_ENDPOINT: "https://s3.placeholder.invalid"
      PROTECTED_S3_REGION: "placeholder_region"
      PROTECTED_S3_BUCKET: "placeholder_protected_bucket"
      PROTECTED_CHUNK_PREFIX: "chunks/"
      PROTECTED_S3_REQUEST_TIMEOUT_MS: "30000"

    write:
      # Only ingest-tus and the scheduler receive write credentials.
      # Rotation: On compromise or each 90 days
      PROTECTED_S3_ACCESS_KEY_ID: "placeholder_protected_write_access_key_id"
      PROTECTED_S3_SECRET_ACCESS_KEY: "placeholder_protected_write_secret_access_key"

    read:
      # Only protected materialization runtimes receive read credentials.
      # Rotation: On compromise or each 90 days
      PROTECTED_S3_READONLY_ACCESS_KEY_ID: "placeholder_protected_read_access_key_id"
      PROTECTED_S3_READONLY_SECRET_ACCESS_KEY: "placeholder_protected_read_secret_access_key"

  quarantine:
    configuration:
      # Raw uploads use one isolated quarantine storage role.
      # Rotation: On bucket, region, endpoint, or storage layout change
      QUARANTINE_S3_ENDPOINT: "https://s3.placeholder.invalid"
      QUARANTINE_S3_REGION: "placeholder_region"
      QUARANTINE_S3_BUCKET: "placeholder_quarantine_bucket"
      QUARANTINE_S3_REQUEST_TIMEOUT_MS: "30000"

    write:
      # Only ingest-tus receives quarantine write credentials.
      # Rotation: On compromise or each 90 days
      QUARANTINE_S3_ACCESS_KEY_ID: "placeholder_quarantine_write_access_key_id"
      QUARANTINE_S3_SECRET_ACCESS_KEY: "placeholder_quarantine_write_secret_access_key"

  renditions:
    delivery:
      # The rendition Worker proxies verified reads from ephemeral materializer disk.
      # Rotation: On compromise or each 90 days
      MATERIALIZER_ORIGIN_URL: "https://materializer.placeholder.invalid"
      MATERIALIZER_RENDITION_SHARED_SECRET: "placeholder_materializer_rendition_shared_secret"

  delivery:
    shared:
      # The API and delivery Worker use this public delivery origin.
      PACKAGE_DELIVERY_AUDIENCE: "https://delivery.placeholder.invalid"
      # The API and delivery Worker bind grants to this public API origin.
      PACKAGE_INSTALL_ISSUER: "https://api.placeholder.invalid"
      # The key identifier selects one package contract signing epoch.
      PACKAGE_INSTALL_SIGNING_KEY_ID: "placeholder_package_install_key_id"

    api:
      # Store the base64url Ed25519 seed only in the API secret path.
      # Rotation: Coordinate the API and delivery Worker deployments.
      PACKAGE_INSTALL_SIGNING_PRIVATE_KEY: "placeholder_package_install_signing_private_key"

      # Private Linux materialization control-plane origin used by the API.
      # Rotation: On materialization service topology change
      MATERIALIZATION_CONTROL_PLANE_INTERNAL_BASE_URL: "https://materialization.internal.placeholder.invalid"
      # Shared bearer secret used only by the API and materialization control plane.
      # Generate: openssl rand -base64 32
      # Rotation: Coordinate the API and materialization control-plane deployments.
      MATERIALIZATION_API_SHARED_SECRET: "placeholder_materialization_api_shared_secret"

      # PostgreSQL workflow store for one-time native operation authorization and DPoP replay state.
      # Rotation: On catalog database credential change
      PACKAGE_OPERATION_AUTHORIZATION_DATABASE_URL: "postgresql://placeholder_user:placeholder_password@placeholder.invalid:5432/catalog"
      # PostgreSQL workflow store for immutable package-scoped VPM alias publications.
      # Rotation: On catalog database credential change
      VPM_ALIAS_PUBLICATION_CATALOG_DATABASE_URL: "postgresql://placeholder_user:placeholder_password@placeholder.invalid:5432/catalog"

      # Read-only PostgreSQL catalog access for exact TUF object versions.
      # Rotation: On catalog database credential change
      PACKAGE_INSTALLER_TUF_CATALOG_DATABASE_URL: "postgresql://placeholder_reader:placeholder_password@placeholder.invalid:5432/catalog"
      # This stable identifier selects the package installer repository.
      # Rotation: On repository identity change
      PACKAGE_INSTALLER_TUF_REPOSITORY_ID: "package-installer"
      # Read-only B2 credentials for the metadata bucket.
      # Rotation: On compromise or each 90 days
      PACKAGE_INSTALLER_TUF_S3_ACCESS_KEY_ID: "placeholder_tuf_readonly_access_key_id"
      PACKAGE_INSTALLER_TUF_S3_SECRET_ACCESS_KEY: "placeholder_tuf_readonly_secret_access_key"
      # Exact metadata storage location.
      # Rotation: On metadata bucket or endpoint change
      PACKAGE_INSTALLER_TUF_S3_ENDPOINT: "https://s3.placeholder.invalid"
      PACKAGE_INSTALLER_TUF_S3_REGION: "placeholder_region"
      PACKAGE_INSTALLER_TUF_S3_BUCKET: "placeholder_metadata_bucket"
      PACKAGE_INSTALLER_TUF_S3_REQUEST_TIMEOUT_MS: "30000"

      # Public VPM index origin for persistent creator-managed product repositories.
      VPM_BASE_URL: "https://vpm.placeholder.invalid"
      VPM_PUBLIC_INDEX_URL: "https://vpm.yucp.club/index.json"
      # Creator-owned VPM origins use exact Worker Custom Domains such as
      # creatorname.private.yucp.club. The runtime token must be limited to
      # Workers Scripts read/write for this account and the yucp.club zone.
      PRIVATE_VPM_ROOT_DOMAIN: "private.yucp.club"
      PRIVATE_VPM_CLOUDFLARE_ACCOUNT_ID: "placeholder_cloudflare_account_id"
      PRIVATE_VPM_CLOUDFLARE_API_TOKEN: "placeholder_private_vpm_cloudflare_token"
      PRIVATE_VPM_CLOUDFLARE_SERVICE: "creator-assistant-dashboard"
      PRIVATE_VPM_CLOUDFLARE_ZONE_ID: "placeholder_yucp_club_zone_id"
      PRIVATE_VPM_CLOUDFLARE_ZONE_NAME: "yucp.club"

    worker:
      # The Worker verifies grants with this base64url Ed25519 public key.
      PACKAGE_INSTALL_SIGNING_PUBLIC_KEY: "placeholder_package_install_signing_public_key"

  materialization:
    capacity:
      # The Cloudflare standard-4 materializer reserves 4 GiB for verified chunks.
      MATERIALIZATION_CHUNK_CACHE_MAX_BYTES: "4294967296"
      # Preserve a 2 GiB emergency floor while phase reservations bound active work.
      MATERIALIZATION_EMERGENCY_DISK_FLOOR_BYTES: "2147483648"

    catalog:
      # The control plane uses PostgreSQL for durable workflow state.
      # Rotation: On database credential change
      PACKAGE_CATALOG_DATABASE_URL: "postgresql://placeholder_user:placeholder_password@placeholder.invalid:5432/catalog"

    control:
      # The control plane uses the same bearer secret as storage.delivery.api.
      # Rotation: Coordinate the API and materialization control-plane deployments.
      MATERIALIZATION_API_SHARED_SECRET: "placeholder_materialization_api_shared_secret"

      # Materializers use this separate secret for internal control-plane requests.
      # Generate: openssl rand -base64 32
      # Rotation: Coordinate the control-plane and materializer deployments.
      MATERIALIZATION_MATERIALIZER_SHARED_SECRET: "placeholder_materialization_materializer_shared_secret"

      # The public URL binds capabilities to the exact control-plane origin.
      # Rotation: On materialization service topology change
      MATERIALIZATION_CONTROL_PLANE_PUBLIC_BASE_URL: "https://materialization.placeholder.invalid"

      # The control plane dispatches durable jobs to the Cloudflare Workflow.
      # Rotation: On Cloudflare materializer topology change
      MATERIALIZATION_CLOUDFLARE_DISPATCH_URL: "https://materializer.placeholder.invalid/v1/materialization/dispatch"
      # Generate: openssl rand -base64 32
      # Rotation: Coordinate the control-plane and Cloudflare Worker deployments.
      MATERIALIZATION_CLOUDFLARE_DISPATCH_SHARED_SECRET: "placeholder_materialization_cloudflare_dispatch_shared_secret"
      # The Worker authenticates requests to its selected container instance.
      # Generate: openssl rand -base64 32
      # Rotation: Coordinate the Cloudflare Worker and container deployment.
      MATERIALIZATION_CONTAINER_EXECUTION_SECRET: "placeholder_materialization_container_execution_secret"
      # Enable only after the Cloudflare Worker and container image are healthy.
      MATERIALIZATION_CLOUDFLARE_DISPATCH_ENABLED: "false"

      # These values define the capability signing epoch.
      # Generate both keys from one Ed25519 key pair.
      # Rotation: Coordinate every capability verifier before changing the epoch.
      MATERIALIZATION_CAPABILITY_KEY_ID: "placeholder_materialization_capability_key_id"
      MATERIALIZATION_CAPABILITY_PRIVATE_KEY: "placeholder_materialization_capability_private_key"
      MATERIALIZATION_CAPABILITY_PUBLIC_KEY: "placeholder_materialization_capability_public_key"

    key-broker:
      # The private key broker supplies scoped per-file materialization keys.
      # Rotation: On key-broker topology change
      MATERIALIZATION_KEY_BROKER_BASE_URL: "https://key-broker.internal.placeholder.invalid"
      # Generate: openssl rand -base64 32
      # Rotation: Coordinate the control-plane and key-broker deployments.
      MATERIALIZATION_KEY_BROKER_SHARED_SECRET: "placeholder_materialization_key_broker_shared_secret"

    receipt-signing:
      # These values sign exact protected-output receipts.
      # Generate the private value as one unpadded base64url Ed25519 seed.
      # Rotation: Retain the old public key until all receipts expire.
      MATERIALIZATION_RECEIPT_KEY_ID: "placeholder_materialization_receipt_key_id"
      MATERIALIZATION_RECEIPT_PRIVATE_KEY: "placeholder_materialization_receipt_private_key"

    source-delivery:
      # These values bind short-lived grants to protected source delivery.
      MATERIALIZATION_SOURCE_DELIVERY_BASE_URL: "https://materialization-source.placeholder.invalid"
      MATERIALIZATION_SOURCE_GRANT_AUDIENCE: "https://materialization-source.placeholder.invalid"
      MATERIALIZATION_SOURCE_GRANT_ISSUER: "https://materialization.placeholder.invalid"
      # Generate the private value as one unpadded base64url Ed25519 seed.
      # Rotation: Coordinate the control plane and source delivery Worker.
      MATERIALIZATION_SOURCE_GRANT_KEY_ID: "placeholder_materialization_source_grant_key_id"
      MATERIALIZATION_SOURCE_GRANT_PRIVATE_KEY: "placeholder_materialization_source_grant_private_key"

    runtime:
      # These required values select exact materialization contracts.
      MATERIALIZATION_KEY_EPOCH: "placeholder_materialization_key_epoch"
      MATERIALIZATION_ALGORITHM_VERSION: "placeholder_materialization_algorithm_version"
      MATERIALIZATION_PLUGIN_VERSION: "placeholder_materialization_plugin_version"

# =============================================================================
# YUCP Package Signing Secrets (/yucp/signing/)
# =============================================================================

yucp:
  signing:
    # Ed25519 private key for the YUCP Certificate Authority root key.
    # This is the root of trust for all creator certificates.
    # Generate: openssl genpkey -algorithm ed25519 | openssl pkey -text -noout
    #   or use: node -e "const {generateKeyPairSync}=require('crypto'); const {privateKey}=generateKeyPairSync('ed25519',{privateKeyEncoding:{type:'pkcs8',format:'der'}}); console.log(privateKey.toString('base64'))"
    # Rotation: NEVER, rotating invalidates all issued certificates.
    #   To rotate: issue new root, revoke old certs, re-issue to creators.
    YUCP_ROOT_PRIVATE_KEY: "placeholder_base64_ed25519_private_key"

    # Stable identifier for the root key (used in certificate keyId field).
    # Increment only when rotating the root key (e.g. yucp-root-2025 -> yucp-root-2026).
    # Rotation: Only when YUCP_ROOT_PRIVATE_KEY changes.
    YUCP_ROOT_KEY_ID: "yucp-root-2025"
    # Legacy alias retained for older deploy scripts. Prefer YUCP_ROOT_KEY_ID.
    YUCP_KEY_ID: "yucp-root-2025"

    # JSON trust bundle containing the public key derived from YUCP_ROOT_PRIVATE_KEY.
    # Required whenever the root public key is not one of the app's built-in pinned roots.
    # Shape: {"version":1,"keys":[{"keyId":"yucp-root-2025","algorithm":"Ed25519","publicKeyBase64":"..."}]}
    YUCP_TRUST_BUNDLE_JSON: '{"version":1,"keys":[{"keyId":"yucp-root-2025","algorithm":"Ed25519","publicKeyBase64":"placeholder_base64_ed25519_public_key"}]}'

# =============================================================================
# Environment-Specific Notes
# =============================================================================

# DEV Environment:
# - Use Discord test application
# - Use local Postgres or dev database
# - Convex dev deployment
# - Can use weaker secrets for testing

# PREVIEW Environment:
# - Use Discord test application
# - Use staging database
# - Convex preview deployment
# - Production-like secret strength

# PROD Environment:
# - Use Discord production application
# - Use production database with strong credentials
# - Convex production deployment
# - Maximum secret strength required
# - Enable all audit logging
